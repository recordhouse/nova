  <body>
    <main class="game-shell" aria-label="NOVA 게임 프로토타입">
      <section class="game-loading" data-game-loading aria-label="게임 이미지와 영상 로딩 중">
        <div class="game-loading-panel">
          <div class="game-loading-logo" aria-hidden="true">NOVA</div>
          <div class="game-loading-status">
            <span>LOADING</span>
            <output data-game-loading-percent>0%</output>
          </div>
          <div
            class="game-loading-track"
            data-game-loading-progress
            role="progressbar"
            aria-label="이미지와 영상 로딩 진행률"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span class="game-loading-fill"></span>
          </div>
          <div class="game-loading-caption">VISUAL ASSETS</div>
        </div>
      </section>
      <canvas id="game" width="720" height="1280" aria-label="게임 화면"></canvas>

      <section class="test-controls" data-test-controls hidden aria-label="테스트 모드 도구">
        <button
          type="button"
          class="test-jump-path-button"
          data-test-jump-path
          aria-label="가로형 점프길 바로 보기"
        >
          JUMP
        </button>
        <button
          type="button"
          class="test-resolution-button"
          data-test-resolution
          aria-label="현재 해상도 720 곱하기 1280, 해상도 전환"
        >
          RES 720
        </button>
        <button
          type="button"
          class="test-orientation-button"
          data-test-orientation
          aria-label="현재 세로 화면, 가로 화면으로 전환"
        >
          VIEW 세로
        </button>
        <button
          type="button"
          class="test-map-button"
          data-test-map
          aria-label="전체 지도 표시 꺼짐"
          aria-pressed="false"
        >
          MAP
        </button>
        <button
          type="button"
          class="test-portal-button"
          data-test-portal
          aria-label="포털 입구 바로 보기"
        >
          PORTAL
        </button>
        <button
          type="button"
          class="test-music-button"
          data-test-music
          aria-label="배경음악 재생 중, 누르면 일시정지"
          aria-pressed="false"
        >
          BGM Ⅱ
        </button>
        <button
          type="button"
          class="test-invincibility-button"
          data-test-invincibility
          aria-label="무적 모드 꺼짐"
          aria-pressed="false"
        >
          GOD
        </button>
        <button
          type="button"
          class="test-ultimate-button"
          data-test-ultimate
          aria-label="필살기 즉시 발동"
        >
          ULT NOW
        </button>
        <button
          type="button"
          class="test-area-button player-area"
          data-test-player-area
          aria-label="주인공 영역 표시 꺼짐"
          aria-pressed="false"
        >
          P AREA
        </button>
        <button
          type="button"
          class="test-area-button monster-area"
          data-test-monster-area
          aria-label="몬스터·포탑 영역 표시 꺼짐"
          aria-pressed="false"
        >
          M AREA
        </button>
        <button
          type="button"
          class="test-monster-spawn-button monster1"
          data-test-spawn-monster1
          aria-label="몹1 한 마리 생성"
        >
          M1
        </button>
        <button
          type="button"
          class="test-monster-spawn-button monster2"
          data-test-spawn-monster2
          aria-label="몹2 한 마리 생성"
        >
          M2
        </button>
        <button
          type="button"
          class="test-monster-spawn-button monster3"
          data-test-spawn-monster3
          aria-label="몹3 한 마리 생성"
        >
          M3
        </button>
        <button
          type="button"
          class="test-monster-spawn-button monster4"
          data-test-spawn-monster4
          aria-label="몹4 한 마리 생성"
        >
          M4
        </button>
        <button
          type="button"
          class="test-monster-spawn-button turret"
          data-test-spawn-turret
          aria-label="포탑 한 기 생성"
        >
          T
        </button>
      </section>

      <section class="touch-controls" aria-label="터치 조작 버튼">
        <div class="move-controls" data-movement-zone>
          <button
            type="button"
            class="movement-joystick"
            data-movement-joystick
            aria-label="이동, 위쪽 사격 조준, 앉기 조이스틱"
          >
            <span class="joystick-knob" aria-hidden="true"></span>
          </button>
        </div>
        <div class="action-controls">
          <button class="control-button action fire" data-control="fire" aria-label="사격">FIRE</button>
          <button
            type="button"
            class="control-button action ultimate"
            data-control="ultimate"
            data-ultimate-control
            data-charges="0"
            aria-label="필살기, 충전 0개"
            aria-disabled="true"
          >ULT</button>
          <button
            type="button"
            class="control-button action jump"
            data-control="jump"
            aria-label="점프"
          >JUMP</button>
        </div>
      </section>
    </main>
